repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      # - id: check-added-large-files

  # Ruff: fast linter + import sort (isort replacement)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]        # auto-fix where possible
      - id: ruff-format      # code formatter (keeps in sync with ruff rules)

  # Black: opinionated code formatter (works great with ruff)
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  # Modernize syntax (e.g., f-strings) to your Python version
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.17.0
    hooks:
      - id: pyupgrade
        args: [--py39-plus]

  # Optional: static typing (skip if not ready yet)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: []
